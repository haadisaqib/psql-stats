app-id: com.github.yourusername.psql-stats
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: psql-stats
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri

modules:
  - name: psql-stats
    buildsystem: simple
    build-commands:
      - go build -trimpath -ldflags="-s -w" -o /app/bin/psql-stats .
    sources:
      - type: git
        url: https://github.com/yourusername/psql-stats.git
        tag: v1.0.0
      - type: script
        commands:
          - |
            cd /app
            go mod download
            go mod verify

